# expense_tracker/docker-compose.yml
version: '3.8'

services:
  # -------------------------------------------------------------------
  # Servicio de Nginx (Proxy Inverso para el Backend)
  # -------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx # Busca el Dockerfile en la carpeta "nginx"
      dockerfile: Dockerfile
    container_name: app_nginx
    ports:
      - "8200:80" # El puerto 8200 de tu host apunta al puerto 80 del contenedor Nginx
    volumes:
      - ./api:/var/www/html # Nginx necesita acceder al código de Laravel
    depends_on:
      - backend
    networks:
      - app-network

  # -------------------------------------------------------------------
  # Servicio de Backend (Solo PHP-FPM)
  # -------------------------------------------------------------------
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        - APP_ENV=local
    container_name: app_backend
    volumes:
      - ./api:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=expense_tracker_api
      - DB_USERNAME=user
      - DB_PASSWORD=password
    networks:
      - app-network
    command: sh -c "
      echo 'Waiting for database...';
      while ! php artisan migrate --force --no-interaction; do
        sleep 5;
        echo 'Retrying database connection...';
      done;
      echo 'Database is ready. Starting PHP-FPM...';
      php artisan db:seed --force --no-interaction;
      php-fpm"

  # -------------------------------------------------------------------
  # Servicio de Frontend (React)
  # -------------------------------------------------------------------
  frontend:
    build:
      context: ./front # Busca el Dockerfile en la carpeta "front"
      dockerfile: Dockerfile
    container_name: app_frontend
    ports:
      - "3200:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    command: npm run dev -- --host
    networks:
      - app-network

  # -------------------------------------------------------------------
  # Servicio de Base de Datos
  # -------------------------------------------------------------------
  database:
    image: mysql:8.0
    container_name: app_database
    restart: always
    ports:
      - "3326:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=expense_tracker_api
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
    driver: local
