# expense_tracker/nginx/nginx.conf

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html index.htm;
    charset utf-8;

    # Bloque principal que envía todas las peticiones a index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Bloque para procesar archivos PHP
    # Los headers CORS son manejados completamente por Laravel (Fruitcake/HandleCors)
    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
